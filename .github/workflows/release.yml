name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Build FFmpeg test environment
        run: docker build -f Dockerfile.build -t termireels-builder .

      - name: Test source
        run: |
          docker run --rm -v "${{ github.workspace }}:/app" termireels-builder \
            sh -c 'gofmt -l . | tee /tmp/unformatted &&
              test ! -s /tmp/unformatted &&
              go test -count=1 -timeout 120s ./... &&
              go vet ./... &&
              go build -buildvcs=false -o /tmp/termireels .'

  release-source:
    needs: verify
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Check release metadata
        run: |
          test -f LICENSE
          test -f THIRD_PARTY_NOTICES.md
          test -f CHANGELOG.md

      - name: Create source archive
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          git archive \
            --format=tar.gz \
            --prefix="termireels-${VERSION}/" \
            -o "dist/termireels-${VERSION}.tar.gz" \
            HEAD
          sha256sum "dist/termireels-${VERSION}.tar.gz" \
            > "dist/termireels-${VERSION}.tar.gz.sha256"

      - name: Extract changelog
        id: changelog
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          BODY=$(awk "/^## \\[${VERSION}\\]/{found=1; next} /^## \\[/{if(found) exit} found{print}" CHANGELOG.md)
          if [ -z "$BODY" ]; then
            echo "found=false" >> "$GITHUB_OUTPUT"
          else
            echo "found=true" >> "$GITHUB_OUTPUT"
            {
              echo "body<<EOF"
              echo "$BODY"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Publish source release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/termireels-*.tar.gz
            dist/termireels-*.tar.gz.sha256
          body: ${{ steps.changelog.outputs.found == 'true' && steps.changelog.outputs.body || '' }}
          generate_release_notes: ${{ steps.changelog.outputs.found != 'true' }}
          prerelease: ${{ contains(github.ref_name, '-') }}
