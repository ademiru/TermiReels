name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Check shell installers
        run: bash -n scripts/build-wsl.sh scripts/install-wsl-release.sh

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: creator-provider/package-lock.json

      - name: Test creator provider
        working-directory: creator-provider
        run: |
          npm ci
          npm test

      - uses: docker/setup-buildx-action@v4

      - name: Build FFmpeg test environment
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile.build
          load: true
          tags: termireels-builder:ci
          cache-from: type=gha,scope=termireels-builder
          cache-to: type=gha,mode=max,scope=termireels-builder

      - name: Test source
        run: |
          docker run --rm -v "${{ github.workspace }}:/app" termireels-builder:ci \
            sh -c 'gofmt -l . | tee /tmp/unformatted &&
              test ! -s /tmp/unformatted &&
              go test -count=1 -timeout 120s ./... &&
              go vet ./... &&
              go build -buildvcs=false -o /tmp/termireels .'

  build-wsl-release:
    needs: verify
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: creator-provider/package-lock.json

      - name: Build creator provider runtime
        working-directory: creator-provider
        run: |
          npm ci
          npm run build
          npm prune --omit=dev

      - uses: docker/setup-buildx-action@v4

      - name: Build FFmpeg release environment
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile.build
          load: true
          tags: termireels-builder:release
          cache-from: type=gha,scope=termireels-builder

      - name: Assemble self-contained WSL package
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          PACKAGE_ROOT="${GITHUB_WORKSPACE}/dist/stage/termireels"
          mkdir -p \
            "${PACKAGE_ROOT}/creator-provider/dist" \
            "${PACKAGE_ROOT}/creator-provider/node_modules" \
            "${PACKAGE_ROOT}/runtime"

          docker run --rm \
            -v "${GITHUB_WORKSPACE}:/app" \
            termireels-builder:release \
            sh -c "go build -buildvcs=false -ldflags='-X main.Version=${VERSION}' -o /app/dist/stage/termireels/termireels ."

          cp -R creator-provider/dist/. "${PACKAGE_ROOT}/creator-provider/dist/"
          cp -R creator-provider/node_modules/playwright-core \
            "${PACKAGE_ROOT}/creator-provider/node_modules/"
          cp creator-provider/package.json creator-provider/package-lock.json \
            "${PACKAGE_ROOT}/creator-provider/"
          cp assets/asound-wsl.conf "${PACKAGE_ROOT}/runtime/"
          find "${PACKAGE_ROOT}/creator-provider/dist" -name '*.test.js' -delete
          printf '%s\n' "${VERSION}" > "${PACKAGE_ROOT}/VERSION"
          cp LICENSE THIRD_PARTY_NOTICES.md README.md "${PACKAGE_ROOT}/"

          NODE_VERSION="v$(node -p 'process.versions.node')"
          NODE_ARCHIVE="node-${NODE_VERSION}-linux-x64.tar.xz"
          curl --fail --location --silent --show-error \
            "https://nodejs.org/dist/${NODE_VERSION}/${NODE_ARCHIVE}" \
            --output "${RUNNER_TEMP}/${NODE_ARCHIVE}"
          curl --fail --location --silent --show-error \
            "https://nodejs.org/dist/${NODE_VERSION}/SHASUMS256.txt" \
            --output "${RUNNER_TEMP}/SHASUMS256.txt"
          (
            cd "${RUNNER_TEMP}"
            grep " ${NODE_ARCHIVE}$" SHASUMS256.txt | sha256sum --check -
          )
          tar -xJf "${RUNNER_TEMP}/${NODE_ARCHIVE}" -C "${PACKAGE_ROOT}/runtime"
          mv "${PACKAGE_ROOT}/runtime/node-${NODE_VERSION}-linux-x64" \
            "${PACKAGE_ROOT}/runtime/node"

          tar -C "${GITHUB_WORKSPACE}/dist/stage" -czf \
            "${GITHUB_WORKSPACE}/dist/termireels-linux-amd64-wsl.tar.gz" \
            termireels
          (
            cd "${GITHUB_WORKSPACE}/dist"
            sha256sum termireels-linux-amd64-wsl.tar.gz \
              > termireels-linux-amd64-wsl.tar.gz.sha256
          )

      - uses: actions/upload-artifact@v4
        with:
          name: termireels-wsl-release
          path: |
            dist/termireels-linux-amd64-wsl.tar.gz
            dist/termireels-linux-amd64-wsl.tar.gz.sha256
          if-no-files-found: error

  release-source:
    needs:
      - verify
      - build-wsl-release
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v4
        with:
          name: termireels-wsl-release
          path: dist

      - name: Check release metadata
        run: |
          test -f LICENSE
          test -f THIRD_PARTY_NOTICES.md
          test -f CHANGELOG.md

      - name: Create source archive
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          git archive \
            --format=tar.gz \
            --prefix="termireels-${VERSION}/" \
            -o "dist/termireels-${VERSION}.tar.gz" \
            HEAD
          sha256sum "dist/termireels-${VERSION}.tar.gz" \
            > "dist/termireels-${VERSION}.tar.gz.sha256"

      - name: Extract changelog
        id: changelog
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          BODY=$(awk "/^## \\[${VERSION}\\]/{found=1; next} /^## \\[/{if(found) exit} found{print}" CHANGELOG.md)
          if [ -z "$BODY" ]; then
            echo "found=false" >> "$GITHUB_OUTPUT"
          else
            echo "found=true" >> "$GITHUB_OUTPUT"
            {
              echo "body<<EOF"
              echo "$BODY"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/termireels-*.tar.gz
            dist/termireels-*.tar.gz.sha256
          body: ${{ steps.changelog.outputs.found == 'true' && steps.changelog.outputs.body || '' }}
          generate_release_notes: ${{ steps.changelog.outputs.found != 'true' }}
          prerelease: ${{ contains(github.ref_name, '-') }}
