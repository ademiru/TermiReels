name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  installer-syntax:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      - name: Parse PowerShell installer
        shell: pwsh
        run: |
          [scriptblock]::Create(
            [System.IO.File]::ReadAllText("scripts/install-windows.ps1")
          ) | Out-Null

  creator-provider:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: creator-provider

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: creator-provider/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Type-check, build and test provider
        run: npm test

  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Check shell installers
        run: bash -n scripts/build-wsl.sh scripts/install-wsl-release.sh

      - uses: docker/setup-buildx-action@v4

      - name: Build FFmpeg test environment
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile.build
          load: true
          tags: termireels-builder:ci
          cache-from: type=gha,scope=termireels-builder
          cache-to: type=gha,mode=max,scope=termireels-builder

      - name: Format, test, vet and build
        run: |
          docker run --rm -v "${{ github.workspace }}:/app" termireels-builder:ci \
            sh -c 'gofmt -l . | tee /tmp/unformatted &&
              test ! -s /tmp/unformatted &&
              go test -count=1 -timeout 120s ./... &&
              go vet ./... &&
              go build -buildvcs=false -o /tmp/termireels .'
